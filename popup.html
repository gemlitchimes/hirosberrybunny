<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Hiro's Berry Bunny</title>
  <link rel="stylesheet" href="popup-fonts.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="panel">
    <header>
      <img src="img/bunny.png" alt="" width="56" height="56" />
      <div>
        <h1>Hiro’s Berry Bunny</h1>
        <p class="sub">Bánh dâu sữa cho AI Studio</p>
      </div>
    </header>

    <label class="row big">
      <span>Bật giao diện Berry Bunny</span>
      <input type="checkbox" data-key="enabled" />
      <i class="sw"></i>
    </label>

    <section class="group">
      <label class="row">
        <span>Intro khi mở AI Studio</span>
        <input type="checkbox" data-key="intro" />
        <i class="sw"></i>
      </label>
      <label class="row">
        <span>Bé thỏ ôm dâu ở góc màn hình</span>
        <input type="checkbox" data-key="decal" />
        <i class="sw"></i>
      </label>
      <label class="row">
        <span>Tiếng chuông khi bấm nút</span>
        <input type="checkbox" data-key="sound" />
        <i class="sw"></i>
      </label>
      <label class="row">
        <span>Báo khi AI trả lời xong</span>
        <input type="checkbox" data-key="doneChime" />
        <i class="sw"></i>
      </label>
    </section>

    <section class="group">
      <label class="slider">
        <span>Âm lượng <b data-out="volume"></b></span>
        <input type="range" min="0" max="100" step="5" data-key="volume" />
      </label>
    </section>

    <div class="actions">
      <button id="test" data-chime="medium">♪ Nghe thử</button>
      <button id="replay" data-chime="short">▶ Xem lại intro</button>
      <button id="reset" data-chime="short">Mặc định</button>
    </div>

    <p class="tip">Mẹo: đặt AI Studio ở giao diện <b>Sáng</b> (Settings → Theme → Light) để màu đẹp nhất.</p>
    <p class="credit">created by <span>Poesía of the Gemlit Chimes</span></p>
  </main>
  <script src="chime.js"></script>
  <script src="popup.js"></script>
</body>
</html>
